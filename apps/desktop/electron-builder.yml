appId: com.graph1ks.emo
productName: E-MO-Engine
artifactName: E-MO-Engine-${version}-${arch}.${ext}

directories:
  output: ../../release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../web/dist
    to: web

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
