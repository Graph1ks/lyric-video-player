name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if ! npm install --ignore-scripts --no-audit --no-fund; then
            echo "::warning::npm install hit a transient Arborist/cache failure; clearing cache and retrying once"
            rm -rf node_modules
            npm cache clean --force
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Publication audit
        run: python scripts/repo_audit.py
